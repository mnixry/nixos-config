name: Setup Nix
description: Setup Nix with caching
inputs:
  free-space:
    description: Whether to free space before building
    required: false
    default: "true"
  github-token:
    description: The GitHub token to use for caching
    required: true
runs:
  using: "composite"
  steps:
    - name: Free runner space
      id: cleanup
      if: inputs.free-space == 'true'
      uses: justinthelaw/maximize-github-runner-space@main
      with:
        cleanup-profile: max
    - name: Prepare compressed Nix filesystem
      if: inputs.free-space == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo fallocate -l "$(( ${{ steps.cleanup.outputs.available-bytes-after }} - 6 * 1024 * 1024 * 1024 ))" /nix.img
        sudo mkfs.btrfs --nodiscard -m single /nix.img
        sudo mkdir -p /nix
        sudo mount -o loop,ssd,noatime,nodiscard,compress-force=zstd /nix.img /nix
        sudo mkdir -p /nix/tmp
        sudo chmod 1777 /nix/tmp
        echo "TMPDIR=/nix/tmp" >> "$GITHUB_ENV"
    - uses: NixOS/nix-installer-action@main
      with:
        extra-conf: |
          access-tokens = github.com=${{ inputs.github-token }}
