name: NixOS Build
description: Build NixOS system closure with caching
inputs:
  hostname:
    description: Hostname whose configuration should be built
    required: true
  niks3-server-url:
    description: The URL of the Niks3 server
    required: true
runs:
  using: "composite"
  steps:
    - uses: Mic92/niks3-action@main
      with:
        server-url: ${{ inputs.niks3-server-url }}
    - name: Apply Nix Settings
      shell: bash
      run: |
        nix build .#nix-conf
        mkdir -p ~/.config/nix
        cat ./result | tee -a ~/.config/nix/nix.conf
    - name: Check Formatting
      shell: bash
      run: |
        nix fmt --print-build-logs -- \
          --fail-on-change
    - name: Run Nix Build
      shell: bash
      env:
        HOSTNAME: ${{ inputs.hostname }}
      run: |
        nix build ".#${HOSTNAME}" \
          --fallback \
          --print-build-logs
