name: NixOS Build
description: Build NixOS system closure with caching
inputs:
  hostname:
    description: Hostname whose configuration should be built
    required: true
  niks3-server-url:
    description: The URL of the Niks3 server
    required: true
runs:
  using: "composite"
  steps:
    - uses: Mic92/niks3-action@main
      id: niks3
      with:
        server-url: ${{ inputs.niks3-server-url }}
    - name: Apply Nix Settings
      shell: bash
      run: |
        nix build .#nix-conf
        mkdir -p ~/.config/nix
        cat ./result | tee -a ~/.config/nix/nix.conf
    - name: Check Formatting
      shell: bash
      run: |
        nix fmt --print-build-logs -- \
          --fail-on-change
    - name: Run Nix Build
      shell: bash
      env:
        HOSTNAME: ${{ inputs.hostname }}
      run: |
        nix build ".#${HOSTNAME}" \
          --fallback \
          --print-build-logs
    - name: Pin System Toplevel
      if: github.ref == 'refs/heads/main'
      shell: bash
      env:
        HOSTNAME: ${{ inputs.hostname }}
      run: |
        "${{ steps.niks3.outputs.binary-dir }}/niks3" push \
          --server-url "${{ inputs.niks3-server-url }}" \
          --auth-token-script "${{ steps.niks3.outputs.auth-token-script }}" \
          --pin "${HOSTNAME}" \
          ./result
